 </div>
    <script>
        // Track the active camera stream globally
        let currentCameraStream = null;

        function navigateTo(targetSlideId) {
            // 1. SAFELY STOP CAMERA if user navigates away from success screen
            if (currentCameraStream) {
                currentCameraStream.getTracks().forEach(track => track.stop());
                currentCameraStream = null;
                
                // Clear video element binding
                const videoElement = document.getElementById('camera-stream');
                if (videoElement) {
                    videoElement.srcObject = null;
                }
            }

            // 2. Hide all existing slides
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });

            // 3. Activate the new targeted slide
            const targetSlide = document.getElementById(targetSlideId);
            if (targetSlide) {
                targetSlide.classList.add('active');
                
                // 4. TRIGGER CAMERA if target slide is the success-screen
                if (targetSlideId === 'success-screen') {
                    startUserCamera();
                }
            }
        }

// WebRTC camera connection handler
function startUserCamera() {
    const video = document.getElementById('camera-stream');
    
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "user", 
                width: { ideal: 480 },
                height: { ideal: 800 }
            },
            audio: false // Explicitly disable audio to avoid permission/autoplay blocks
        })
        .then(function(stream) {
            currentCameraStream = stream;
            video.srcObject = stream;
            
            // 🔥 FORCE PLAYBACK: Tells the browser to actively start rendering frames
            video.onloadedmetadata = function(e) {
                video.play().catch(function(error) {
                    console.error("Video play broadcast interrupted:", error);
                });
            };
        })
        .catch(function(error) {
            console.error("Camera permissions denied or unavailable:", error);
            alert("Unable to open camera. Please ensure permissions are enabled.");
        });
    } else {
        alert("Your browser environment does not support camera capture streams.");
    }
}
    </script>
